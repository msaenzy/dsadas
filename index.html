<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spondylus Soluciones Digitales</title>
    <!-- Favicon / Logo Icon -->
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Global error logger to prevent silent blank white pages
      window.addEventListener('error', function(e) {
        showDiagnosticError('Uncaught Error: ' + e.message + '\nFile: ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        showDiagnosticError('Unhandled Promise Rejection: ' + (e.reason ? (e.reason.stack || e.reason) : 'Unknown reason'));
      });
      function showDiagnosticError(msg) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="padding: 24px; font-family: monospace; background: #0d1117; color: #f85149; min-height: 100vh;">' +
            '<h2 style="color: #ff7b72; margin-top:0;">⚠️ Diagnostic Error Log (White Screen Detected)</h2>' +
            '<p style="color: #c9d1d9;">The application encountered an error during initialization:</p>' +
            '<pre style="background: #161b22; padding: 16px; border-radius: 6px; white-space: pre-wrap; color: #ffa657;">' + msg + '</pre>' +
            '<p style="color: #8b949e; font-size: 12px; margin-top: 16px;">Page URL: ' + window.location.href + '</p>' +
            '</div>';
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
