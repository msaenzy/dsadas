<!doctype html>
<html lang="es" class="no-js" data-base="../" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso · Spondylus</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0E2A44">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Manrope:wght@400;600;700&family=Cinzel:wght@600&display=swap">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
<style>
  body { background: var(--navy); }
  .gate { position: fixed; inset: 0; display: grid; }
  .gate iframe { width: 100%; height: 100%; border: 0; background: var(--ivory); }
  .gate__wait { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #E6EEF0; padding: 2rem; isolation: isolate; overflow: hidden; }
  .gate__wait .orb--1 { opacity: .5; }
  .gate__card { display: grid; gap: 1rem; justify-items: center; max-width: 30rem; }
  .gate__card h1 { color: #F6F1E8; font-family: var(--font-display); font-weight: 300; font-size: clamp(2.4rem, 1.6rem + 3vw, 3.6rem); line-height: 1.05; }
  .gate__card h1 em { color: var(--seafoam); }
  .gate__card p { color: rgba(230,238,240,.75); }
  .gate__ring { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--seafoam); animation: ring 1.6s var(--ease-out) infinite; }
  .gate.is-ready .gate__wait { opacity: 0; pointer-events: none; transition: opacity .6s .2s; }
</style>
<script>document.documentElement.classList.replace("no-js","js");</script>
</head>
<body>
<main class="gate" id="gate">
  <iframe id="panel" title="Centro de Control Spondylus" hidden allow="clipboard-write"></iframe>
  <div class="gate__wait">
    <div class="hero__water" aria-hidden="true"><span class="orb orb--1"></span><span class="orb orb--2"></span></div>
    <div class="gate__card">
      <img src="../assets/images/logo.svg" alt="" width="64" height="64" style="background:#F6F1E8;border-radius:50%;padding:6px">
      <h1>Centro de <em>Control</em></h1>
      <p id="gateMsg">Cargando el acceso seguro…</p>
      <span class="gate__ring" id="gateRing" aria-hidden="true"></span>
      <a class="btn btn--light" id="gateOpen" href="#" target="_blank" rel="noopener" hidden>Abrir el panel en una pestaña nueva</a>
    </div>
  </div>
</main>
<script type="module">
  import { CMS } from "../config/cms.js";
  const f = document.getElementById("panel"), msg = document.getElementById("gateMsg"), open = document.getElementById("gateOpen");
  if (!CMS.adminUrl) {
    msg.textContent = "Falta conectar el panel: pega la URL /exec de tu Apps Script en config/cms.js (adminUrl).";
    document.getElementById("gateRing").hidden = true;
  } else {
    open.href = CMS.adminUrl;
    f.src = CMS.adminUrl; f.hidden = false;
    f.addEventListener("load", () => document.getElementById("gate").classList.add("is-ready"));
    setTimeout(() => { open.hidden = false; }, 6000);
  }
</script>
</body>
</html>
